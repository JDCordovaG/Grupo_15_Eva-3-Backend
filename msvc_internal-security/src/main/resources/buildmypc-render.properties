spring.config.activate.on-profile=render

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
spring.h2.console.enabled=false

app.jwt.secreto=${JWT_SECRETO}
internal.service.token=${INTERNAL_SERVICE_TOKEN}
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.cloud.openfeign.client.config.default.connectTimeout=15000
spring.cloud.openfeign.client.config.default.readTimeout=120000
