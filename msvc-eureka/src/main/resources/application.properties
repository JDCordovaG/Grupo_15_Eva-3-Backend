spring.application.name=msvc-eureka
# Puerto estandar del servidor Eureka. El panel queda en http://localhost:8761
server.port=${PORT:8761}

# El propio servidor NO se registra ni descarga el registro: el es el registro.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
