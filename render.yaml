# Despliegue gratuito para inicio de sesión y administración del catálogo.
# Los servicios restantes pueden añadirse después, según la cuota de Render.
databases:
  - name: buildmypc-core-db
    databaseName: buildmypc_core_db
    user: buildmypc_core_db_user
    plan: free
    region: virginia
    postgresMajorVersion: "18"

envVarGroups:
  - name: buildmypc-shared-secrets
    envVars:
      - key: JWT_SECRETO
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: Grupo_15_Eva-3-Backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: buildmypc-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: SERVICE_JAR
        value: msvc-gateway-0.0.1-SNAPSHOT.jar
      - key: CORS_ORIGENES
        value: https://grupo-15-eva-3-frontend.vercel.app
      - key: AUTH_SERVICE_URL
        value: https://buildmypc-g15-auth.onrender.com
      - key: COMPONENT_SERVICE_URL
        value: https://buildmypc-g15-components.onrender.com
      - key: CPU_SERVICE_URL
        value: https://buildmypc-g15-cpus.onrender.com
      - key: GPU_SERVICE_URL
        value: https://buildmypc-g15-gpus.onrender.com
      - key: MOTHERBOARD_SERVICE_URL
        value: https://buildmypc-g15-motherboards.onrender.com
      - key: RAM_SERVICE_URL
        value: https://buildmypc-g15-rams.onrender.com
      - key: POWER_SUPPLY_SERVICE_URL
        value: https://buildmypc-g15-power-supplies.onrender.com

  - type: web
    name: buildmypc-g15-auth
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: buildmypc-shared-secrets
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: SERVICE_JAR
        value: msvc_auth-service-0.0.1-SNAPSHOT.jar
      - key: DB_HOST
        fromDatabase:
          name: buildmypc-core-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: buildmypc-core-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: buildmypc-core-db
          property: database
      - key: DB_USUARIO
        fromDatabase:
          name: buildmypc-core-db
          property: user
      - key: DB_CLAVE
        fromDatabase:
          name: buildmypc-core-db
          property: password
      - key: DB_SCHEMA
        value: auth_service
      - key: AUTH_BOOTSTRAP_ENABLED
        value: "true"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: administrador@buildmypc.cl
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_TECH_EMAIL
        value: tecnico@buildmypc.cl
      - key: BOOTSTRAP_TECH_PASSWORD
        generateValue: true

