# Blueprint de BuildMyPC: 12 microservicios + Gateway, todos Docker/Free.
# Ver DEPLOYMENT.md antes de aplicar: el Postgres Free de Render vence a los 30 días.
databases:
  - name: buildmypc-db
    databaseName: buildmypc
    user: buildmypc
    plan: free
    region: ohio
    postgresMajorVersion: "18"

envVarGroups:
  - name: buildmypc-shared-secrets
    envVars:
      - key: JWT_SECRETO
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: buildmypc-g15-auth
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVarGroups:
      - buildmypc-shared-secrets
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: SERVICE_JAR
        value: msvc_auth-service-0.0.1-SNAPSHOT.jar
      - key: DB_HOST
        fromDatabase:
          name: buildmypc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: buildmypc-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: buildmypc-db
          property: database
      - key: DB_USUARIO
        fromDatabase:
          name: buildmypc-db
          property: user
      - key: DB_CLAVE
        fromDatabase:
          name: buildmypc-db
          property: password
      - key: DB_SCHEMA
        value: auth_service
      - key: USER_SERVICE_URL
        value: https://buildmypc-g15-users.onrender.com

