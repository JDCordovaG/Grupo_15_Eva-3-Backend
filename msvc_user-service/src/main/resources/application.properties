spring.config.import=classpath:buildmypc-render.properties
spring.application.name=msvc-user-service
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
server.port=${PORT:8091}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/user-service}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USUARIO:sa}
spring.datasource.password=${DB_CLAVE:sa}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.info.env.enabled=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
